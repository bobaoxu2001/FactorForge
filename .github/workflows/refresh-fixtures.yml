name: Scheduled fixture refresh

# Keeps the committed data snapshots fresh on a schedule:
#   - src/__fixtures__/yahoo-snapshot.json        (3y OHLCV, npm run fixture:refresh)
#   - src/__fixtures__/fundamentals-snapshot.json (valuation/quality, npm run fundamentals:refresh)
#   - src/__fixtures__/events/*                   (event-engine prices and run log, npm run events:refresh)
#   - src/data/events/forecast-ledger.json        (appends rolling forecasts, npm run events:forecast)
#   - src/data/events/thesis-ledger.json          (appends newly configured theses)
# Fixed research editions and their PDFs are refreshed manually as one change.
#
# Runs on GitHub's US-based runners where the keyless Yahoo endpoints are
# reachable. The full verification suite (lint/typecheck/test/build) runs
# AGAINST the refreshed fixtures before anything is pushed — the drift guards
# and pipeline snapshot tests are the gate. Changes land as a pull request so
# a maintainer walks the review steps in docs/fixture_refresh.md; nothing is
# committed to main automatically.
#
# NOTE: PRs opened with GITHUB_TOKEN do not trigger the CI workflow (GitHub
# limitation). The same gates already ran inside this workflow — the PR body
# says so — but re-running CI manually on the PR is fine if you want the check
# mark.

on:
  schedule:
    # Mondays 05:00 UTC — pre-US-market, after a full trading week.
    - cron: "0 5 * * 1"
  workflow_dispatch:

concurrency:
  group: refresh-fixtures
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    name: Refresh · Verify · Open PR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Protect pending ledger history
        id: history
        run: node scripts/check-refresh-history.mjs

      - name: Install dependencies
        run: npm ci

      - name: Refresh price snapshot
        run: npm run fixture:refresh

      - name: Refresh fundamentals snapshot
        run: npm run fundamentals:refresh

      # Do not run research:refresh here. The freight sample is a fixed edition:
      # new source retrievals require a new cutoff, source review and matching
      # PDF/export. Updating those fixtures alone intentionally fails the build.

      # Event engine: refresh its market snapshot, then append this week's
      # rolling forecasts to the hash-chained ledger. Existing records are
      # never rewritten; past forecasts are scored at render time.
      - name: Refresh event-intelligence snapshot
        run: npm run events:refresh

      - name: Append rolling forecasts to the ledger
        run: npm run events:forecast

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- src/__fixtures__ src/data/events; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Fixtures unchanged — nothing to refresh."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- src/__fixtures__ src/data/events
          fi

      # The refreshed fixtures must pass the same gates as any other change:
      # universe drift guards, the full research-pipeline snapshot test, and a
      # keyless production build.
      - name: Lint
        if: steps.diff.outputs.changed == 'true'
        run: npm run lint

      - name: Typecheck
        if: steps.diff.outputs.changed == 'true'
        run: npm run typecheck

      - name: Test
        if: steps.diff.outputs.changed == 'true'
        run: npm test

      - name: Build
        if: steps.diff.outputs.changed == 'true'
        run: npm run build

      - name: Open or update refresh PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_REMOTE_SHA: ${{ steps.history.outputs.expected_remote_sha }}
        run: |
          set -euo pipefail
          DATE="$(date -u +%F)"
          BRANCH="chore/scheduled-fixture-refresh"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add src/__fixtures__ src/data/events/forecast-ledger.json src/data/events/thesis-ledger.json
          git commit -m "chore(fixtures): scheduled snapshot refresh ($DATE)" \
            -m "Automated weekly refresh of price, fundamentals and event snapshots, plus appended forecast and thesis records. Fixed research editions are unchanged. Lint, typecheck, the full test suite and a keyless production build all passed against these changes in this workflow run."
          git push --force-with-lease="refs/heads/$BRANCH:$EXPECTED_REMOTE_SHA" origin "$BRANCH"

          BODY="Automated weekly refresh of the committed data snapshots (as of $DATE).

          - \`src/__fixtures__/yahoo-snapshot.json\` — 3y OHLCV for the research universe
          - \`src/__fixtures__/fundamentals-snapshot.json\` — valuation/quality fundamentals
          - \`src/__fixtures__/events/\` — event prices, fundamentals and run manifest
          - \`src/data/events/forecast-ledger.json\` — appended rolling forecasts (existing records preserved)
          - \`src/data/events/thesis-ledger.json\` — appended newly configured theses

          Fixed research editions and their PDF/export are unchanged. The preflight checked the existing refresh branch's ledger history; a concurrent remote update will reject this push.

          Lint, typecheck, the full test suite, and a keyless production build **already passed against these fixtures** in the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). CI does not auto-trigger on token-created PRs — re-run it manually if you want the check mark.

          Before merging, walk the review steps in \`docs/fixture_refresh.md\` (provenance, key set, coverage sanity, no synthetic leakage).

          🤖 Generated with [Claude Code](https://claude.com/claude-code)"

          if gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$BRANCH" --title "chore(fixtures): scheduled snapshot refresh ($DATE)" --body "$BODY"
          else
            gh pr create --base main --head "$BRANCH" \
              --title "chore(fixtures): scheduled snapshot refresh ($DATE)" \
              --body "$BODY"
          fi
